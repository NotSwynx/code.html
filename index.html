<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 300;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .code-section {
            margin: 2rem 0;
        }

        .code {
            font-size: clamp(2.5rem, 12vw, 5rem);
            font-weight: 600;
            font-family: 'SF Mono', Monaco, 'Roboto Mono', monospace;
            letter-spacing: 0.1em;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            margin: 1rem 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .code:hover {
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(255,255,255,0.05);
        }

        .no-code {
            color: #666;
            font-size: 1.2rem;
            font-weight: 300;
        }

        .copy-btn {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-1px);
        }

        .instructions {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.8;
            margin-top: 2rem;
            line-height: 1.6;
        }

        .error {
            display: none;
            color: #ff6b6b;
            font-size: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .code {
                font-size: 2.5rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Complete</h1>
        
        <div class="code-section">
            <div id="codeDisplay" class="code">Loading...</div>
            <button id="copyBtn" class="copy-btn" style="display: none;">Copy Code</button>
        </div>
        
        <div id="errorMsg" class="error">
            No code found. Complete the ads properly.
        </div>
        
        <div class="instructions">
            Copy code → Discord → <code>/code YOURCODE</code>
        </div>
    </div>

    <script>
        function extractCode() {
            // Handle every possible URL format
            let code = null;
            const href = window.location.href;
            
            // Method 1: ?code=ABC123
            const urlParams = new URLSearchParams(window.location.search);
            code = urlParams.get('code');
            
            // Method 2: /code/ABC123
            if (!code) {
                const codeMatch = href.match(/code[\/=]([A-Z0-9]{8,12})/i);
                if (codeMatch) code = codeMatch[1];
            }
            
            // Method 3: Any code-like string after code.html
            if (!code) {
                const afterHtml = href.split('code.html')[1];
                if (afterHtml) {
                    const match = afterHtml.match(/[A-Z0-9]{8,12}/i);
                    if (match) code = match[0];
                }
            }
            
            // Clean and validate
            if (code) {
                code = code.replace(/[^A-Z0-9]/g, '').substring(0, 10).toUpperCase();
            }
            
            return code && code.length >= 8 ? code : null;
        }

        function init() {
            const code = extractCode();
            const codeDisplay = document.getElementById('codeDisplay');
            const copyBtn = document.getElementById('copyBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            if (code) {
                codeDisplay.textContent = code;
                copyBtn.style.display = 'inline-block';
                
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(code).then(() => {
                        copyBtn.textContent = 'Copied!';
                        copyBtn.style.background = 'rgba(59, 130, 246, 0.3)';
                        setTimeout(() => {
                            copyBtn.textContent = 'Copy Code';
                            copyBtn.style.background = '';
                        }, 1500);
                    });
                };
            } else {
                codeDisplay.style.display = 'none';
                copyBtn.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        // Initialize immediately and on load
        init();
        window.addEventListener('load', init);
    </script>
</body>
</html>
